<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#260b12">
  <title>Shravan &amp; Nikki | Wedding Invitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { --burgundy:#721b2c; --gold:#bd914b; --ink:#593b35; }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#17080c}
    html{height:100%} /* FIX #1: give html height for svh reliability */
    body{min-height:100svh;display:flex;justify-content:center;align-items:center;color:var(--ink);font-family:"Cormorant Garamond",serif;overflow-x:hidden}
    .card{position:relative;width:min(100vw,540px);height:100svh;min-height:680px;max-height:1100px;overflow:hidden;background:#f8e9cf;isolation:isolate}
    .visual{position:absolute;inset:0;width:100%;height:100%}
    .visual img,.visual video{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
    .opening{z-index:3;transition:opacity .8s ease}
    .opening.dismissed{opacity:0;pointer-events:none}
    .open-hotspot {
      position: absolute;
      left: 50%;
      top: 55.5%;
      transform: translate(-50%, -50%);
      width: min(46%, 220px);
      aspect-ratio: 1 / 1;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .open-hotspot img{width:100%;height:100%;object-fit:contain}
    .video-layer{z-index:2;background:#18090d}
    .invitation{position:absolute;z-index:4;left:12%;right:12%;top:24%;bottom:5.5%;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;visibility:hidden;pointer-events:none;overflow-y:auto;scrollbar-width:none;transition:opacity .7s ease;padding-bottom:2%}
    .invitation.visible{visibility:visible;opacity:1;pointer-events:auto}
    .invitation::-webkit-scrollbar{display:none}
    .reveal{opacity:0;transform:translateY(13px);filter:blur(2px)}
    .invitation.visible .reveal{animation:fadeUp .95s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--delay,0s)}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0);filter:blur(0)}}
    .wedding-logo{width:clamp(130px,34vw,175px);max-height:150px;object-fit:contain;margin:0 auto 1.2%}
    .text-content{display:flex;flex-direction:column;align-items:center;width:100%;padding-top:clamp(8px,1.5vh,16px)}
    .family-line{font-size:clamp(9px,2.1vw,11.5px);font-weight:700;letter-spacing:.2em;margin:.45% 0 .25%;color:#876538;text-transform:uppercase}
    .family-ornament{width:63%;height:2px;background:linear-gradient(90deg,transparent,rgba(189,145,75,.65),transparent);margin:1.1% 0}
    .invite-line{color:#876538;font:700 clamp(10px,2.35vw,12.5px)/1.35 "Cormorant Garamond",serif;letter-spacing:.17em;text-transform:uppercase;margin:.3% 0 .7%}
    .headline{color:var(--burgundy);font:italic 600 clamp(31px,7.2vw,41px)/.98 "Cormorant Garamond",serif;margin:1.1% 0 1%}
    .blessing-line{color:#876538;font:italic 600 clamp(13px,3vw,16px)/1.2 "Cormorant Garamond",serif;margin:1.1% 0 1.5%}
    .section-label{color:#8c6b3d;font:700 clamp(10px,2.4vw,13px)/1.15 "Cormorant Garamond",serif;letter-spacing:.25em;margin:.7% 0 .15%}
    .person-name{color:var(--burgundy);font-family:"Allura",cursive;font-size:clamp(39px,9vw,49px);line-height:1;margin:0}
    .parent-line{color:#6c514b;font:600 clamp(13.5px,3vw,16px)/1.18 "Cormorant Garamond",serif;margin:.35% 0 1.1%}
    .weds{color:#a77b3b;font:italic 600 clamp(18px,4.2vw,23px)/1.1 "Great Vibes",cursive;margin:.35% 0 .5%}

    /* BEAUTIFUL MEDIUM BOXES */
    .actions{
      display:flex;
      flex-direction:column;
      align-items:center;
      width:100%;
      gap:12px;
      margin-top:auto;
      padding-top:18px;
    }
    .action-btn{
      position:relative;
      width: min(72%, 260px);
      border: 1.5px solid #c9a86a;
      border-radius: 12px;
      /* FIX #6: increased horizontal padding to clear the left ✦ star */
      padding: 12px 34px;
      color: #fff8e6;
      background: linear-gradient(180deg, #8d2a40 0%, #6a1a2e 50%, #581321 100%);
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      font-size: clamp(14px, 3.6vw, 16px);
      letter-spacing: .12em;
      text-transform: uppercase;
      text-align: center;
      cursor: pointer;
      box-shadow: 
        0 4px 12px rgba(88,19,33,.25),
        inset 0 1px 0 rgba(255,255,255,.25),
        inset 0 -1px 0 rgba(0,0,0,.2);
      transition: all .25s ease;
    }
    .action-btn::before{
      content:"";
      position:absolute;
      inset:2px;
      border:1px solid rgba(255,242,217,.35);
      border-radius:10px;
      pointer-events:none;
    }
    .action-btn::after{
      content:"✦";
      position:absolute;
      left:12px;
      top:50%;
      transform:translateY(-50%);
      font-size:10px;
      color:#f3d89b;
      opacity:.9;
    }
    .action-btn span.after-star::after{
      content:"✦";
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      font-size:10px;
      color:#f3d89b;
    }
    .action-btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(88,19,33,.32), inset 0 1px 0 rgba(255,255,255,.3);
      background: linear-gradient(180deg, #9a2f47 0%, #721b2c 100%);
    }
    .action-btn.secondary{
      color: var(--burgundy);
      background: linear-gradient(180deg, #fff9ec 0%, #f5e6c8 100%);
      border-color: #d4b171;
    }
    .action-btn.secondary::after{color:var(--burgundy)}
    .action-btn.secondary::before{border-color:rgba(189,145,75,.4)}
    .action-btn:active{transform:translateY(0px)}

    .modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
    .modal.open{display:grid}
    .modal-card{background:#fff7e8;border:1.5px solid #bd914b;padding:28px 24px;border-radius:16px;text-align:center;max-width:340px;width:90%}
  </style>
</head>
<body>
  <main class="card">
    <!-- FIX #4: preload="metadata" for faster readyState; playsinline kept -->
    <div class="visual video-layer"><video id="openingVideo" playsinline preload="metadata"><source src="assets/opening-animation.mp4" type="video/mp4"></video></div>
    <div class="visual opening" id="openingScreen"><button class="open-hotspot" id="openButton" aria-label="Open wedding invitation"><img src="assets/open-button.png" alt="Open"></button></div>
    <section class="invitation" id="invitation">
      <img src="assets/wedding-logo.png" alt="Logo" class="wedding-logo reveal" style="--delay:.15s">
      <div class="text-content">
        <p class="family-line reveal" style="--delay:.45s">Together with our families</p>
        <div class="family-ornament reveal" style="--delay:.62s"></div>
        <p class="invite-line reveal" style="--delay:.8s">Joyfully invite you to celebrate</p>
        <h1 class="headline reveal" style="--delay:1.05s">The Wedding<br>Celebration</h1>
        <p class="blessing-line reveal" style="--delay:1.3s">With the Blessings of Our Elders</p>
        <p class="section-label reveal" style="--delay:1.6s">THE GROOM</p>
        <h2 class="person-name reveal" style="--delay:1.85s">Shravan</h2>
        <p class="parent-line reveal" style="--delay:2.1s">Son of<br>Mrs. Savitri Yadav & Mr. Suresh Yadav</p>
        <p class="weds reveal" style="--delay:2.4s">weds</p>
        <p class="section-label reveal" style="--delay:2.65s">THE BRIDE</p>
        <h2 class="person-name reveal" style="--delay:2.9s">Nikki</h2>
        <p class="parent-line reveal" style="--delay:3.15s">Daughter of<br>Mrs. Radha Devi & Mr. Jitendra Yadav</p>
      </div>

      <div class="actions reveal" style="--delay:3.8s">
        <button class="action-btn" id="viewInvitation" type="button"><span class="after-star">View Invitation</span></button>
        <button class="action-btn secondary" id="revealDate" type="button"><span class="after-star">Reveal the Date ♥</span></button>
      </div>
    </section>
  </main>
  <div class="modal" id="dateModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h3 id="modalTitle" style="color:var(--burgundy);font-family:Allura;font-size:42px;margin:0 0 8px">Save the Date</h3>
      <p style="letter-spacing:.22em;font-weight:800;font-size:20px;color:var(--burgundy)">12TH DEC 2025</p>
      <button class="action-btn" id="closeModal" style="width:100%;margin-top:14px"><span class="after-star">Close</span></button>
    </div>
  </div>
  <script>
    const openingScreen = document.getElementById("openingScreen");
    const openButton    = document.getElementById("openButton");
    const video         = document.getElementById("openingVideo");
    const invitation    = document.getElementById("invitation");
    let started = false, timer = null;

    // FIX #4: only pause if the video actually exists/loaded
    video.pause && video.pause();

    async function startWeddingVideo() {
      if (started) return;
      started = true;
      openButton.disabled = true;
      openingScreen.classList.add("dismissed");

      // FIX #4: guard currentTime — only reset if metadata is loaded
      if (video.readyState >= 1) {
        video.currentTime = 0;
      }

      // Fallback: if video file is missing or play() rejects, show invitation
      try {
        await video.play();
        timer = setTimeout(() => invitation.classList.add("visible"), 3500);
      } catch (e) {
        // Autoplay blocked or file missing — show invitation immediately
        invitation.classList.add("visible");
      }
    }

    function finishWeddingVideo() {
      video.pause();
      if (timer) clearTimeout(timer);
      invitation.classList.add("visible");
    }

    openButton.addEventListener("click", startWeddingVideo);
    video.addEventListener("ended", finishWeddingVideo);

    // If the video never loads (e.g. 404), don't hang forever — reveal after 4s
    video.addEventListener("error", () => {
      if (timer) clearTimeout(timer);
      invitation.classList.add("visible");
    });

    document.getElementById("viewInvitation").addEventListener("click", () =>
      invitation.scrollTo({ top: 0, behavior: "smooth" })
    );

    const modal = document.getElementById("dateModal");
    document.getElementById("revealDate").addEventListener("click", () => {
      modal.classList.add("open");
      document.getElementById("closeModal").focus();
    });
    document.getElementById("closeModal").addEventListener("click", () =>
      modal.classList.remove("open")
    );
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });
    // FIX #10: Escape closes modal
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("open")) {
        modal.classList.remove("open");
      }
    });
  </script>
</body>
</html>
